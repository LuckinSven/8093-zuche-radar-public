[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zuche-radar"
version = "0.1.0"
description = "神州车型雷达"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "apscheduler>=3.11,<4",
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.39,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-httpx>=0.35,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
